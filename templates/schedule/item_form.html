{% extends 'base.html' %}
{% load static %}

{% block mainpage %}
<div class="layout-px-spacing">
    <div class="row layout-top-spacing">
        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12 layout-spacing">
            <div class="widget widget-chart-one">
                <div class="widget-heading">
                    <h5 class="">编辑日程</h5>
                </div>
                <div class="widget-content">
                    {% if html_display.warn_message %}
                    <div class="alert {% if html_display.warn_code == 2 %}alert-success{% else %}alert-danger{% endif %}">
                        {{ html_display.warn_message }}
                    </div>
                    {% endif %}
                    <form method="post" action="/schedule/editItem/{{ item.id }}/">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary">保存</button>
                        <a href="/schedule/manage/" class="btn btn-light">取消</a>
                    </form>
                    <p class="text-muted small mt-2 mb-0">
                        待办无需填写开始/结束时间。修改单条不会影响同一重复系列的其他条目。
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
